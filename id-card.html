<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ManzXSub — Member Pass</title>
<link rel="stylesheet" href="style.css">
<style>
  .stage{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .id-card{
    width:340px; max-width:92vw; padding:0 0 22px; overflow:hidden;
    position:relative;
  }
  .id-band{
    background:repeating-linear-gradient(135deg, #1a1a1e, #1a1a1e 10px, #222226 10px, #222226 20px);
    height:14px; width:100%;
  }
  .id-head{ text-align:center; padding:22px 20px 6px; }
  .id-head .brand{ font-size:11px; letter-spacing:2px; color:var(--ink-dim); font-weight:700; }
  .id-head .title{ font-family:'Sora',sans-serif; font-weight:800; font-size:17px; margin-top:2px; }

  .avatar-wrap{
    width:118px; height:118px; margin:16px auto 10px;
    border-radius:50%; overflow:hidden; border:3px solid rgba(255,255,255,0.18);
    box-shadow:0 0 0 6px rgba(255,255,255,0.04);
  }
  .avatar-wrap img{ width:100%; height:100%; object-fit:cover; object-position:top center; }

  .id-name{ text-align:center; font-family:'Sora',sans-serif; font-weight:800; font-size:16px; }
  .id-role{ text-align:center; font-size:11.5px; color:var(--ink-dim); margin-top:2px; }

  .id-fields{
    margin:20px 20px 0; border-top:1px dashed var(--line); padding-top:16px;
  }
  .id-fields .field-row{
    display:flex; justify-content:space-between; font-size:12px;
    padding:6px 0; color:var(--ink-dim);
  }
  .id-fields .field-row b{ color:var(--ink); font-weight:600; }

  .id-actions{ padding:20px 20px 0; display:flex; flex-direction:column; gap:10px; }
  .id-actions .btn{ width:100%; text-align:center; }

  .id-note{ text-align:center; font-size:10px; color:var(--ink-dim); opacity:.6; margin-top:14px; padding:0 20px; }
</style>
</head>
<body>
<div class="stage">
  <div class="card id-card">
    <div class="id-band"></div>
    <div class="id-head">
      <div class="brand">MANZ<span class="x">✕</span>SUB</div>
      <div class="title">Member Pass</div>
    </div>

    <div class="avatar-wrap">
      <img src="avatar.jpg" alt="Avatar">
    </div>
    <div class="id-name" id="idName">@username</div>
    <div class="id-role" id="idRole">Member</div>

    <div class="id-fields">
      <div class="field-row"><span>Dikembangkan bareng</span><b>Claude AI</b></div>
      <div class="field-row"><span>Diterbitkan</span><b id="idDate">-</b></div>
      <div class="field-row"><span>Versi</span><b>v1.0.0</b></div>
      <div class="field-row"><span>Status</span><b>Aktif</b></div>
    </div>

    <div class="id-actions">
      <button class="btn" id="btnDashboard">Lanjut ke Dashboard →</button>
      <a class="btn ghost" id="btnDownload" href="overlay-app.apk" download style="text-decoration:none; display:block;">⬇ Download Aplikasi Overlay</a>
      <a class="btn ghost" href="panduan.html" style="text-decoration:none; display:block;">📖 Panduan Setup dari Awal</a>
    </div>

    <div class="id-note">*Bukan kartu identitas asli, cuma buat gaya doang 😄</div>
  </div>
</div>

<script type="module">
  import { sanitizeUsername } from "./firebase-config.js";

  const params = new URLSearchParams(location.search);
  const uname = sanitizeUsername(params.get("user") || localStorage.getItem("manzxsub_user") || "");
  if (!uname) { window.location.href = "index.html"; }
  document.getElementById("idName").textContent = "@" + uname;

  const OWNER_USERNAME = "ferxmc7";
  const isOwner = uname === OWNER_USERNAME;
  document.getElementById("idRole").textContent = isOwner ? "Owner & Developer" : "Member";

  const now = new Date();
  document.getElementById("idDate").textContent = now.toLocaleDateString("id-ID", { day:"numeric", month:"long", year:"numeric" });

  document.getElementById("btnDashboard").addEventListener("click", () => {
    window.location.href = `dashboard.html?user=${uname}`;
  });
</script>
</body>
</html>
