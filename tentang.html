<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ManzXSub — Tentang</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap{ max-width:480px; margin:0 auto; padding:24px 16px 60px; }
  .profile-card{ text-align:center; padding:28px 20px; }
  .avatar-wrap{
    width:96px; height:96px; margin:0 auto 14px;
    border-radius:50%; overflow:hidden; border:3px solid rgba(255,255,255,0.15);
  }
  .avatar-wrap img{ width:100%; height:100%; object-fit:cover; object-position:top center; }
  .profile-card h2{ font-family:'Sora',sans-serif; font-size:17px; margin:0 0 4px; }
  .profile-card p{ font-size:12.5px; color:var(--ink-dim); margin:0; line-height:1.5; }

  .section{ margin-top:20px; padding:20px; }
  .section h3{ font-family:'Sora',sans-serif; font-size:14px; margin:0 0 12px; }

  .stars{ display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
  .star{ font-size:32px; cursor:pointer; color:rgba(255,255,255,0.18); transition:color .15s ease, transform .15s ease; }
  .star.filled{ color:#FFD166; }
  .star:active{ transform:scale(1.2); }
  .rating-info{ text-align:center; font-size:12px; color:var(--ink-dim); }
  .rating-info b{ color:var(--ink); }

  textarea{
    width:100%; min-height:90px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; color:var(--ink); font-family:'Inter',sans-serif;
    font-size:13.5px; resize:vertical; margin-bottom:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card profile-card">
    <div class="avatar-wrap"><img src="avatar.jpg" alt="Owner"></div>
    <h2>ferxmc7</h2>
    <p>Pembuat & pengelola ManzXSub — subathon overlay buat TikTok Live, dibangun sedikit demi sedikit dari HP.</p>
  </div>

  <div class="card section">
    <h3>Kasih Rating</h3>
    <div class="stars" id="stars">
      <span class="star" data-v="1">★</span>
      <span class="star" data-v="2">★</span>
      <span class="star" data-v="3">★</span>
      <span class="star" data-v="4">★</span>
      <span class="star" data-v="5">★</span>
    </div>
    <div class="rating-info" id="ratingInfo">Memuat rating...</div>
  </div>

  <div class="card section">
    <h3>Masukan / Komentar</h3>
    <textarea id="feedbackText" placeholder="Kasih tau kekurangan, ide fitur, atau apapun..."></textarea>
    <button class="btn" id="btnSendFeedback" style="width:100%;">Kirim Masukan</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { db } from "./firebase-config.js";
  import { ref, get, update, push, runTransaction } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---- Rating ----
  const ratingRef = ref(db, "meta/rating");
  const stars = document.querySelectorAll(".star");

  async function loadRating(){
    const snap = await get(ratingRef);
    const r = snap.val() || { sum: 0, count: 0 };
    const avg = r.count ? (r.sum / r.count).toFixed(1) : "0.0";
    document.getElementById("ratingInfo").innerHTML = `<b>${avg}</b> / 5 dari ${r.count} rating`;
  }
  loadRating();

  stars.forEach(star => {
    star.addEventListener("click", async () => {
      const val = Number(star.dataset.v);
      stars.forEach(s => s.classList.toggle("filled", Number(s.dataset.v) <= val));

      await runTransaction(ratingRef, (current) => {
        const c = current || { sum: 0, count: 0 };
        c.sum += val;
        c.count += 1;
        return c;
      });
      toast("Makasih ratingnya! ⭐");
      loadRating();
    });
  });

  // ---- Feedback ----
  document.getElementById("btnSendFeedback").addEventListener("click", async () => {
    const text = document.getElementById("feedbackText").value.trim();
    if (!text) { toast("Isi dulu masukannya"); return; }
    await push(ref(db, "feedback"), { text, ts: Date.now() });
    document.getElementById("feedbackText").value = "";
    toast("Masukan terkirim, makasih! 🙏");
  });
</script>
</body>
</html>
