<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ManzXSub — Overlay Milestone</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{ background:transparent; }
  .stage{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .goal-card{ text-align:center; width:340px; max-width:92vw; }
  .goal-name{ font-weight:800; line-height:1.2; margin-bottom:14px; transition:all .2s ease; }
  .bar-wrap{ height:16px; border-radius:999px; background:rgba(255,255,255,0.12); overflow:hidden; }
  .bar-fill{ height:100%; width:0%; border-radius:999px; transition:width .6s cubic-bezier(.4,0,.2,1), background .2s ease; }
  .pct-text{ margin-top:10px; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; color:var(--ink-dim); }
  .note{ margin-top:6px; font-size:10.5px; color:var(--ink-dim); opacity:.7; }
  .done-text{ font-size:13px; color:var(--ink-dim); }

  .test-panel{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; gap:8px; background:var(--panel); border:1px solid var(--line);
    padding:8px; border-radius:999px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="goal-card">
    <div class="goal-name" id="goalName">Memuat...</div>
    <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
    <div class="pct-text" id="pctText"></div>
    <div class="note" id="testNote"></div>
  </div>
</div>

<div class="test-panel" id="testPanel">
  <button class="btn small" id="btnAdd10">+10 coin (test)</button>
  <button class="btn ghost small" id="btnReset">Reset (test)</button>
</div>

<script type="module">
  import { db, sanitizeUsername } from "./firebase-config.js";
  import { ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const params = new URLSearchParams(location.search);
  const uname = sanitizeUsername(params.get("user") || "");
  const isTest = params.get("test") === "1" || !params.get("user");
  document.getElementById("testPanel").style.display = isTest ? "flex" : "none";
  document.getElementById("testNote").textContent = isTest ? "* Mode test — angka cuma contoh" : "";

  if (!uname) {
    document.getElementById("goalName").textContent = "Tambahin ?user=USERNAME di link buat lihat data asli";
  } else {
    const userRef = ref(db, `users/${uname}`);

    onValue(userRef, (snap) => {
      const data = snap.val() || {};
      const goals = (data.goals && data.goals.length) ? [...data.goals].sort((a,b)=>a.threshold-b.threshold) : [
        { threshold: 10, label: "Goal Kece" }
      ];
      const total = (data.timer && data.timer.totalCoins) || 0;
      const style = data.milestoneStyle || { font:"Sora", effect:"plain", textColor:"#39FF14", barColor:"#FFE600", fontSize:28 };

      let goal = goals.find(g => total < g.threshold);
      let done = false;
      if (!goal) { goal = goals[goals.length - 1]; done = true; }

      const nameEl = document.getElementById("goalName");
      nameEl.textContent = goal.label;
      nameEl.style.fontFamily = style.font;
      nameEl.style.fontSize = style.fontSize + "px";
      nameEl.style.color = style.textColor;
      nameEl.className = "goal-name effect-" + style.effect;

      const pct = Math.min(100, Math.round((total / goal.threshold) * 100));
      document.getElementById("barFill").style.width = pct + "%";
      document.getElementById("barFill").style.background = style.barColor;
      document.getElementById("pctText").textContent = done
        ? `Semua goal kelar! (${total} coin) 🎉`
        : `${total.toLocaleString("id-ID")} / ${goal.threshold.toLocaleString("id-ID")} coin (${pct}%)`;
    });

    document.getElementById("btnAdd10").addEventListener("click", async () => {
      const snap = await get(userRef);
      const d = snap.val() || {};
      const t = d.timer || {};
      await update(ref(db, `users/${uname}/timer`), { totalCoins: (t.totalCoins || 0) + 10 });
    });
    document.getElementById("btnReset").addEventListener("click", async () => {
      const snap = await get(userRef);
      const d = snap.val() || {};
      const t = d.timer || {};
      await update(ref(db, `users/${uname}/timer`), { totalCoins: 0 });
    });
  }
</script>
</body>
</html>
