<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ManzXSub — Overlay Timer</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{ background:transparent; }
  .stage{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .clock-wrap{ text-align:center; }
  .clock-label{ font-family:'Inter',sans-serif; font-weight:700; letter-spacing:3px; font-size:13px; color:var(--ink-dim); margin-bottom:8px; text-transform:uppercase; }
  .clock-display{ font-variant-numeric:tabular-nums; line-height:1; transition:color .2s ease; }
  .coin-count{ margin-top:10px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--ink-dim); }
  .coin-count b{ color:var(--ink); }

  .test-panel{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; gap:8px; background:var(--panel); border:1px solid var(--line);
    padding:8px; border-radius:999px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="clock-wrap">
    <div class="clock-label" id="clockLabel">Waktu Tersisa</div>
    <div class="clock-display" id="clockDisplay">00:00:00</div>
    <div class="coin-count"><b id="coinNow">0</b>/<span id="coinMax">30</span> coin</div>
  </div>
</div>

<div class="test-panel" id="testPanel">
  <button class="btn small" id="btnAdd1">+1 coin (test)</button>
  <button class="btn ghost small" id="btnReset">Reset (test)</button>
</div>

<script type="module">
  import { db, sanitizeUsername } from "./firebase-config.js";
  import { ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
  import { applyTierGate } from "./tier-gate.js";

  const params = new URLSearchParams(location.search);
  const uname = sanitizeUsername(params.get("user") || "");
  const isTest = params.get("test") === "1" || !params.get("user");
  document.getElementById("testPanel").style.display = isTest ? "flex" : "none";

  let maxCoins = 30, minutesPerCoin = 3;
  let state = { timerEnd: 0, timerCoins: 0 };
  let soundEnabled = true, soundVolume = 0.6;
  let litCountRendered = -1;

  let audioCtx;
  function getCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(ctx, freq, start, dur, gain, type = "sine"){
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    osc.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.start(start); osc.stop(start + dur);
  }
  function playTimerSound(){
    if (!soundEnabled) return;
    const ctx = getCtx(); const t = ctx.currentTime;
    tone(ctx, 880, t, 0.09, soundVolume * 0.5, "triangle");
    tone(ctx, 1318, t + 0.07, 0.12, soundVolume * 0.5, "triangle");
  }

  function pad(n){ return n.toString().padStart(2,"0"); }
  function renderClock(){
    const remain = Math.max(0, (state.timerEnd || 0) - Date.now());
    const totalSec = Math.floor(remain / 1000);
    const hh = Math.floor(totalSec / 3600);
    const mm = Math.floor((totalSec % 3600) / 60);
    const ss = totalSec % 60;
    document.getElementById("clockDisplay").textContent = `${pad(hh)}:${pad(mm)}:${pad(ss)}`;
  }
  setInterval(renderClock, 250);

  function applyStyle(style){
    const el = document.getElementById("clockDisplay");
    el.style.fontFamily = style.font || "Share Tech Mono";
    el.style.fontSize = (style.fontSize || 56) + "px";
    el.style.color = style.textColor || "#39FF14";
    el.className = "clock-display effect-" + (style.effect || "glow");
    document.getElementById("clockLabel").textContent = style.labelText || "Waktu Tersisa";
  }

  function renderCoins(){
    const lit = Math.min(state.timerCoins || 0, maxCoins);
    if (lit > litCountRendered && litCountRendered >= 0) playTimerSound();
    litCountRendered = lit;
    document.getElementById("coinNow").textContent = lit;
    document.getElementById("coinMax").textContent = maxCoins;
  }

  if (!uname) {
    document.getElementById("coinMax").textContent = "?";
  } else {
    if (!isTest && uname !== "ferxmc7") await applyTierGate(db, uname, document.querySelector(".stage"));
    const timerRef = ref(db, `users/${uname}/timer`);
    onValue(timerRef, (snap) => {
      const v = snap.val() || {};
      maxCoins = v.maxCoins || maxCoins;
      minutesPerCoin = v.minutesPerCoin || minutesPerCoin;
      soundEnabled = v.soundEnabled !== false;
      soundVolume = (v.soundVolume != null ? v.soundVolume : 60) / 100;
      state.timerEnd = v.timerEnd || 0;
      state.timerCoins = v.timerCoins || 0;
      applyStyle(v.style || {});
      renderCoins();
    });

    document.getElementById("btnAdd1").addEventListener("click", async () => {
      const snap = await get(timerRef);
      const v = snap.val() || {};
      const newCoins = Math.min((v.timerCoins || 0) + 1, v.maxCoins || maxCoins);
      const addedMinutes = Math.max(0, newCoins - (v.timerCoins || 0)) * (v.minutesPerCoin || minutesPerCoin);
      const base = Math.max(v.timerEnd || 0, Date.now());
      await update(timerRef, { timerCoins: newCoins, timerEnd: base + addedMinutes * 60 * 1000, totalCoins: (v.totalCoins||0)+1 });
    });
    document.getElementById("btnReset").addEventListener("click", async () => {
      await update(timerRef, { timerCoins: 0, timerEnd: Date.now() });
    });
  }
</script>
</body>
</html>
