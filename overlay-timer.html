<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ManzXSub — Overlay Timer</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{ background:transparent; }
  .stage{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .ring-wrap{ position:relative; width:220px; height:220px; }
  .tick{ stroke:rgba(255,255,255,0.12); stroke-width:6; stroke-linecap:round; transition:stroke .25s ease; }
  .tick.lit{ stroke:#fff; filter:drop-shadow(0 0 4px rgba(255,255,255,0.7)); }
  .tick.pop{ animation:tickPop .5s ease; }
  @keyframes tickPop{ 0%{stroke-width:6;} 40%{stroke-width:11; filter:drop-shadow(0 0 10px #fff);} 100%{stroke-width:6;} }
  .timer-core{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .timer-display{ font-family:'Sora',sans-serif; font-weight:700; font-size:38px; font-variant-numeric:tabular-nums; }
  .coin-count{ margin-top:4px; font-size:12px; font-weight:600; color:var(--ink-dim); }

  .test-panel{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; gap:8px; background:var(--panel); border:1px solid var(--line);
    padding:8px; border-radius:999px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="ring-wrap">
    <svg viewBox="0 0 220 220" id="ringSvg" style="width:100%;height:100%;"></svg>
    <div class="timer-core">
      <div class="timer-display"><span id="mm">00</span>:<span id="ss">00</span></div>
      <div class="coin-count"><b id="coinNow">0</b>/<span id="coinMax">30</span> coin</div>
    </div>
  </div>
</div>

<div class="test-panel" id="testPanel">
  <button class="btn small" id="btnAdd1">+1 coin (test)</button>
  <button class="btn ghost small" id="btnReset">Reset (test)</button>
</div>

<script type="module">
  import { db, sanitizeUsername } from "./firebase-config.js";
  import { ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const params = new URLSearchParams(location.search);
  const uname = sanitizeUsername(params.get("user") || "");
  const isTest = params.get("test") === "1" || !params.get("user");
  document.getElementById("testPanel").style.display = isTest ? "flex" : "none";

  let maxCoins = 30, minutesPerCoin = 3;
  let state = { timerEnd: 0, timerCoins: 0 };
  let litCountRendered = -1;

  const svg = document.getElementById("ringSvg");
  const cx = 110, cy = 110, r = 96;
  let ticks = [];
  function buildRing(n){
    svg.innerHTML = "";
    ticks = [];
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      const angle2 = ((i + 0.62) / n) * 2 * Math.PI - Math.PI / 2;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(angle2), y2 = cy + r * Math.sin(angle2);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("class", "tick");
      svg.appendChild(line);
      ticks.push(line);
    }
  }
  buildRing(maxCoins);

  function pad(n){ return n.toString().padStart(2,"0"); }
  function renderTimer(){
    const remain = Math.max(0, (state.timerEnd || 0) - Date.now());
    const totalSec = Math.floor(remain / 1000);
    document.getElementById("mm").textContent = pad(Math.floor(totalSec / 60));
    document.getElementById("ss").textContent = pad(totalSec % 60);
  }
  setInterval(renderTimer, 250);

  let soundEnabled = true, soundVolume = 0.6;
  let audioCtx;
  function getCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(ctx, freq, start, dur, gain, type = "sine"){
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    osc.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.start(start); osc.stop(start + dur);
  }
  function playTimerSound(){
    if (!soundEnabled) return;
    const ctx = getCtx(); const t = ctx.currentTime;
    tone(ctx, 880, t, 0.09, soundVolume * 0.5, "triangle");
    tone(ctx, 1318, t + 0.07, 0.12, soundVolume * 0.5, "triangle");
  }

  function renderRing(){
    const lit = Math.min(state.timerCoins || 0, maxCoins);
    ticks.forEach((t, i) => t.classList.toggle("lit", i < lit));
    if (lit > litCountRendered && litCountRendered >= 0) {
      for (let i = litCountRendered; i < lit; i++) {
        if (ticks[i]) { ticks[i].classList.add("pop"); setTimeout(() => ticks[i] && ticks[i].classList.remove("pop"), 500); }
      }
      playTimerSound();
    }
    litCountRendered = lit;
    document.getElementById("coinNow").textContent = lit;
    document.getElementById("coinMax").textContent = maxCoins;
  }

  if (!uname) {
    document.getElementById("coinMax").textContent = "?";
  } else {
    const timerRef = ref(db, `users/${uname}/timer`);
    onValue(timerRef, (snap) => {
      const v = snap.val() || {};
      if (v.maxCoins && v.maxCoins !== maxCoins) { maxCoins = v.maxCoins; buildRing(maxCoins); litCountRendered = -1; }
      minutesPerCoin = v.minutesPerCoin || minutesPerCoin;
      soundEnabled = v.soundEnabled !== false;
      soundVolume = (v.soundVolume != null ? v.soundVolume : 60) / 100;
      state.timerEnd = v.timerEnd || 0;
      state.timerCoins = v.timerCoins || 0;
      renderRing();
    });

    document.getElementById("btnAdd1").addEventListener("click", async () => {
      const snap = await get(timerRef);
      const v = snap.val() || {};
      const newCoins = Math.min((v.timerCoins || 0) + 1, v.maxCoins || maxCoins);
      const addedMinutes = Math.max(0, newCoins - (v.timerCoins || 0)) * (v.minutesPerCoin || minutesPerCoin);
      const base = Math.max(v.timerEnd || 0, Date.now());
      await update(timerRef, { timerCoins: newCoins, timerEnd: base + addedMinutes * 60 * 1000, totalCoins: (v.totalCoins||0)+1 });
    });
    document.getElementById("btnReset").addEventListener("click", async () => {
      await update(timerRef, { timerCoins: 0, timerEnd: Date.now() });
    });
  }
</script>
</body>
</html>
